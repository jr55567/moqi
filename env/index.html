<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>能不能读</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0;background:#000;color:#fff;
     font-family:-apple-system,"PingFang SC","HarmonyOS Sans","Microsoft YaHei",sans-serif;
     -webkit-text-size-adjust:100%}
.top{padding:26px 20px 18px;text-align:center;border-bottom:1px solid #1a1a1a}
.top h1{font-size:26px;margin:0 0 6px;font-weight:800}
.top p{color:#888;font-size:13px;margin:0}
.big{padding:34px 20px;text-align:center;border-bottom:1px solid #1a1a1a}
.big .num{font-size:72px;font-weight:900;line-height:1}
.big .lbl{font-size:15px;color:#aaa;margin-top:10px}
.ok{color:#3f6}.bad{color:#f44}.w{color:#fa3}
.row{display:flex;justify-content:space-between;align-items:center;
     padding:15px 20px;border-bottom:1px solid #111;font-size:15px}
.row .k{color:#888}
.row .v{font-weight:700;text-align:right;max-width:60%;word-break:break-all}
.act{padding:22px 20px}
button{display:block;width:100%;padding:24px;border:0;border-radius:14px;
       font-size:21px;font-weight:800;background:#0af;color:#000;margin-bottom:12px}
button:active{opacity:.75}
button:disabled{background:#333;color:#666}
.tip{background:#1a1200;border:1px solid #4a3200;border-radius:12px;
     padding:16px;margin:16px 20px;font-size:14px;line-height:1.75;color:#ffc857}
.tip b{color:#ffe14d}
.tip ol{margin:8px 0 0;padding-left:20px}
.tip li{margin-bottom:7px}
pre{margin:0 20px 24px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:10px;
    padding:14px;font-size:10.5px;color:#777;white-space:pre-wrap;line-height:1.7;max-height:200px;overflow:auto}
</style>
</head>
<body>

<div class="top">
  <h1>这台手机能不能朗读</h1>
  <p id="where">检测中…</p>
</div>

<div class="big">
  <div class="num" id="verdict">?</div>
  <div class="lbl" id="verdictText">正在检测</div>
</div>

<div class="row"><span class="k">打开方式</span><span class="v" id="rBrowser">-</span></div>
<div class="row"><span class="k">朗读接口</span><span class="v" id="rApi">-</span></div>
<div class="row"><span class="k">朗读单元</span><span class="v" id="rUtt">-</span></div>
<div class="row"><span class="k">系统语音数</span><span class="v" id="rVoices">-</span></div>
<div class="row"><span class="k">测试结果</span><span class="v" id="rResult">未测</span></div>

<div id="warn"></div>

<div class="act">
  <button id="go">点这里，读一句话</button>
</div>

<pre id="log"></pre>

<script>
var LOG = [];
function log(s){
  LOG.push(s);
  document.getElementById('log').textContent = LOG.join('\n');
}

var ua = navigator.userAgent;
log('UA: ' + ua);

/* ---- 环境识别 ---- */
var isWX = /MicroMessenger/i.test(ua);
var isXWeb = /XWEB/i.test(ua);
var where = '普通浏览器';
if (isWX) where = isXWeb ? '微信（XWeb 内核）' : '微信';
else if (/MiuiBrowser/i.test(ua)) where = '小米浏览器';
else if (/HuaweiBrowser/i.test(ua)) where = '华为浏览器';
else if (/EdgA/i.test(ua)) where = 'Edge';
else if (/Chrome/i.test(ua)) where = 'Chrome 内核';

document.getElementById('where').textContent = '当前：' + where;
document.getElementById('rBrowser').textContent = where;
document.getElementById('rBrowser').className = 'v ' + (isWX ? 'bad' : 'ok');

/* ---- 接口检测 ---- */
var apiOk = false, uttOk = false;
try {
  apiOk = ('speechSynthesis' in window) && !!window.speechSynthesis;
} catch(e) { apiOk = false; }
try {
  uttOk = ('SpeechSynthesisUtterance' in window) && (typeof window.SpeechSynthesisUtterance === 'function');
} catch(e) { uttOk = false; }

document.getElementById('rApi').textContent = apiOk ? '有' : '没有';
document.getElementById('rApi').className = 'v ' + (apiOk ? 'ok' : 'bad');
document.getElementById('rUtt').textContent = uttOk ? '有' : '没有';
document.getElementById('rUtt').className = 'v ' + (uttOk ? 'ok' : 'bad');

log('speechSynthesis: ' + apiOk);
log('SpeechSynthesisUtterance: ' + uttOk);

/* ---- 语音数量 ---- */
var voiceCount = -1;
function cnt(){
  if (!apiOk) { voiceCount = -1; return; }
  try {
    voiceCount = window.speechSynthesis.getVoices().length;
  } catch(e) { voiceCount = -2; }
  var el = document.getElementById('rVoices');
  if (voiceCount > 0) {
    el.textContent = voiceCount + ' 个';
    el.className = 'v ok';
  } else if (voiceCount === 0) {
    el.textContent = '0 个';
    el.className = 'v w';
  } else {
    el.textContent = voiceCount === -1 ? '无法检测' : '读取失败';
    el.className = 'v bad';
  }
  log('voices: ' + voiceCount);
}
cnt();
setTimeout(cnt, 700);
setTimeout(cnt, 2000);
setTimeout(cnt, 4000);

/* ---- 结论 ---- */
var verdict = document.getElementById('verdict');
var vtext = document.getElementById('verdictText');
var warn = document.getElementById('warn');

function setVerdict(txt, cls, sub){
  verdict.textContent = txt;
  verdict.className = 'num ' + cls;
  vtext.textContent = sub;
}

if (!apiOk) {
  setVerdict('✗', 'bad', '这个环境没有朗读功能');
  document.getElementById('go').disabled = true;
  document.getElementById('go').textContent = '点不了，接口不存在';

  if (isWX) {
    warn.innerHTML =
      '<div class="tip"><b>微信没有朗读功能</b><br>' +
      '这是微信自己的限制，不是手机的问题。<ol>' +
      '<li>点右上角 <b>···</b></li>' +
      '<li>选 <b>在浏览器打开</b></li>' +
      '<li>到浏览器里再打开这个页面</li></ol></div>';
  } else {
    warn.innerHTML =
      '<div class="tip"><b>这个浏览器没有朗读功能</b><br>' +
      '换一个试试：<br>' +
      '· 手机自带浏览器（小米浏览器 / 华为浏览器）<br>' +
      '· Chrome<br>' +
      '· Edge</div>';
  }
} else {
  setVerdict('?', 'w', '接口在，点下面按钮测试');
}

/* ---- 发声测试 ---- */
document.getElementById('go').onclick = function(){
  var res = document.getElementById('rResult');
  if (!apiOk || !uttOk) {
    res.textContent = '接口不存在';
    res.className = 'v bad';
    return;
  }
  log('--- 测试开始 ---');
  try {
    var u = new SpeechSynthesisUtterance('你好，这是一次测试。Hello test.');
    u.lang = 'zh-CN';
    u.rate = 0.9;
    u.volume = 1;

    var r = { s: false, e: false, x: null };
    u.onstart = function(){ r.s = true; log('onstart'); };
    u.onend = function(){ r.e = true; log('onend'); };
    u.onerror = function(ev){ r.x = ev.error; log('onerror=' + ev.error); };

    window.speechSynthesis.speak(u);
    log('speak 已调用');

    setTimeout(function(){
      if (r.x) {
        res.textContent = '报错 ' + r.x;
        res.className = 'v bad';
        setVerdict('✗', 'bad', '报错：' + r.x);
      } else if (r.s) {
        res.textContent = '出声了';
        res.className = 'v ok';
        setVerdict('✓', 'ok', '能朗读，听不到就调媒体音量');
      } else {
        res.textContent = '没反应';
        res.className = 'v bad';
        setVerdict('✗', 'bad', '请求发出但没响应');
      }
      log('结果: ' + res.textContent);
    }, 2600);
  } catch(e) {
    res.textContent = '异常';
    res.className = 'v bad';
    setVerdict('✗', 'bad', '异常：' + e.message);
    log('异常: ' + e.message);
  }
};

log('检测完成');
</script>
</body>
</html>
