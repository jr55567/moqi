<script>!function(){"use strict";window.CN1_POOL=[{topic:"观沧海默写 + 字音字形",qs:[{type:"choice",tag:"古诗默写",q:"观沧海中最能表现诗人博大胸襟的句子是______",opts:["水何澹澹，山岛竦峙","日月之行，若出其中","树木丛生，百草丰茂","秋风萧瑟，洪波涌起"],a:1,sol:"答案 日月之行，若出其中。诗人用想象把太阳月亮银河都写进大海，胸襟之博大全在这两句。其余三项都是眼前实景。"},{type:"fill",tag:"古诗默写",q:"补写观沧海：日月之行，若出其中；______，若出其里。",a:"星汉灿烂",accept:["星汉灿烂"],sol:"星汉灿烂，若出其里。银河灿烂，好像从大海里涌出来一样。星汉指银河，汉就是天河的意思。"},{type:"choice",tag:"字音",q:"下列加点字读音完全正确的一项是______",opts:["应和hè　贮蓄zhù","应和hè　贮蓄chǔ","应和hé　贮蓄zhù","应和hé　贮蓄chǔ"],a:0,sol:"答案 应和 yìng hè，跟着回应；贮蓄 zhù，储存。贮容易误读成 chǔ，储藏的储才读 chǔ。"},{type:"fill",tag:"字形",q:"根据拼音写汉字：夜色渐深，四周一片静mù（  ）",a:"穆",accept:["穆"],sol:"答案是 穆。静穆，庄严安静，禾字旁。不要写成目字旁的睦（和睦的睦）。"},{type:"fill",tag:"成语",q:"写出成语（照着样子模仿，多含贬义）：第一次做菜，他只能______地跟着视频学。",a:"照猫画虎",accept:["照猫画虎"],sol:"答案 照猫画虎。照着猫画老虎，比喻照着样子模仿。近义有东施效颦、邯郸学步，贬义程度更重。"},{type:"choice",tag:"文学常识",q:"《世说新语》的作者是______",opts:["刘义庆","蒲松龄","吴承恩","司马光"],a:0,sol:"答案 刘义庆。南朝宋文学家，组织编写世说新语，志人小说集。咏雪、陈太丘与友期都出自它。蒲松龄写的是聊斋志异。"}]},{topic:"次北固山下 + 病句",qs:[{type:"choice",tag:"古诗哲理",q:"次北固山下中蕴含新旧更替哲理的名句是______",opts:["潮平两岸阔，风正一帆悬","海日生残夜，江春入旧年","乡书何处达，归雁洛阳边","客路青山外，行舟绿水前"],a:1,sol:"答案 海日生残夜，江春入旧年。夜还没退尽太阳已升起，旧年还没过春天已到，生和入两个动词写活了新旧交替，考试最爱考这句的哲理。"},{type:"fill",tag:"古诗默写",q:"补写次北固山下：潮平两岸阔，______。",a:"风正一帆悬",accept:["风正一帆悬"],sol:"风正一帆悬。潮水涨满两岸与水面相平，顺风行船帆高高直挂。悬是高挂的意思。"},{type:"choice",tag:"字音",q:"下列加点字读音完全正确的一项是______",opts:["憔悴qiáo　分歧qí","憔悴qiāo　分歧qí","憔悴qiáo　分歧qì","憔悴qiāo　分歧qì"],a:0,sol:"答案 憔悴 qiáo cuì，形容人瘦弱面色不好；分歧 fēn qí，意见不一致。散步一课的重点字音。"},{type:"choice",tag:"病句",q:"通过这次班会，使我们明白了团结的重要性。病因是______",opts:["缺少主语","搭配不当","语序不当","重复啰嗦"],a:0,sol:"答案 缺少主语。通过……使……两个介词结构连用把主语吞掉了，删掉通过或使任意一个即可。初一病句第一高频考点。"},{type:"fill",tag:"成语",q:"写出成语（比喻好人和坏人混杂在一起）：网络信息______，要学会辨别。",a:"鱼龙混杂",accept:["鱼龙混杂","泥沙俱下"],sol:"答案 鱼龙混杂。鱼和龙混在一起，比喻好坏混杂。近义泥沙俱下也可。"},{type:"fill",tag:"默写",q:"《论语》：吾日三省吾身：为人谋而不忠乎？______？传不习乎？",a:"与朋友交而不信乎",accept:["与朋友交而不信乎"],sol:"与朋友交而不信乎。和朋友交往是不是诚信呢。三省的省读 xǐng，反省的意思。"}]},{topic:"论语十二章",qs:[{type:"fill",tag:"默写",q:"《论语》开篇：学而时习之，______？",a:"不亦说乎",accept:["不亦说乎"],sol:"不亦说乎。说通悦，读 yuè，愉快。这是论语第一处必考通假字，默写时必须写说不写悦。"},{type:"choice",tag:"通假字",q:"不亦说乎中说的读音和意思是______",opts:["yuè，通悦，愉快","shuō，说话","shuì，游说","tuō，通脱"],a:0,sol:"答案 yuè，通悦。通假字考试三要素：本字、读音、意思，缺一不可。论语十二章里另一处通假是知之者不如好之者里的好，读 hào。"},{type:"choice",tag:"文学常识",q:"关于《论语》的说法正确的是______",opts:["孔子本人写的","记录孔子及其弟子言行的语录体著作","老子写的哲学书","孟子的演讲集"],a:1,sol:"答案 记录孔子及其弟子言行的语录体著作。由孔子弟子及再传弟子编纂。孔子是春秋末期鲁国人，儒家学派创始人。"},{type:"fill",tag:"默写",q:"《论语》中感叹时光流逝的句子：逝者如斯夫，______。",a:"不舍昼夜",accept:["不舍昼夜"],sol:"不舍昼夜。时光像河水这样流逝，日夜不停。舍是止息的意思，不是舍弃。"},{type:"fill",tag:"默写",q:"《论语》：温故而知新，______。",a:"可以为师矣",accept:["可以为师矣"],sol:"可以为师矣。温习旧知识能有新体会，就可以做老师了。由此提炼的成语是温故知新。"},{type:"choice",tag:"成语运用",q:"成语使用不恰当的一项是______",opts:["军队打了胜仗，将士们喜出望外","他反应敏捷，总能不假思索地回答","这两幅画各具特色，花枝招展","春回大地，山花烂漫，美不胜收"],a:2,sol:"答案 花枝招展。它形容女子打扮得十分艳丽，用来形容画不恰当。其余三个都用对了。成语运用题先看对象再看褒贬。"}]},{topic:"朱自清《春》 + 修辞方法",qs:[{type:"choice",tag:"课文理解",q:"《春》的结尾把春天比作刚落地的娃娃、小姑娘、青年，依次突出春天的______",opts:["新、美、力","美、新、力","力、新、美","新、力、美"],a:0,sol:"答案 新、美、力。刚落地的娃娃突出新，小姑娘突出美，健壮的青年突出力。三个比喻按人的成长排序，是《春》最经典的结尾。"},{type:"choice",tag:"修辞",q:"小草偷偷地从土里钻出来，嫩嫩的，绿绿的。主要修辞是______",opts:["拟人","比喻","夸张","排比"],a:0,sol:"答案 拟人。偷偷地和钻赋予小草人的情态和动作。判断技巧：出现人的动作情态而没有本体喻体对应，就是拟人。"},{type:"fill",tag:"默写",q:"《春》结尾：春天像健壮的青年，______，领着我们上前去。",a:"有铁一般的胳膊和腰脚",accept:["有铁一般的胳膊和腰脚"],sol:"有铁一般的胳膊和腰脚。注意胳膊二字的写法，膊是月字旁。铁一般又暗含比喻。"},{type:"choice",tag:"修辞综合",q:"红得像火，粉得像霞，白得像雪。使用的修辞是______",opts:["比喻、排比","拟人、排比","比喻、夸张","反复、比喻"],a:0,sol:"答案 比喻、排比。三个像字构成比喻，一连三句结构相同又是排比，本体是春花，喻体分别是火、霞、雪。"},{type:"fill",tag:"成语",q:"写出成语（形容呼吸新鲜空气后神志清醒精神爽朗）：来到郊外，只觉得______。",a:"神清气爽",accept:["神清气爽","心旷神怡"],sol:"答案 神清气爽。近义心旷神怡也可。这两个成语都常出现在写景作文的结尾。"},{type:"fill",tag:"字形",q:"根据拼音写汉字：傍晚的风轻抚着脸，非常柔和温xīn（  ）",a:"馨",accept:["馨"],sol:"答案是 馨。温馨的馨，下面是香字底，共20画，考试常考。"}]},{topic:"济南的冬天 + 字词综合",qs:[{type:"choice",tag:"课文理解",q:"《济南的冬天》中作者老舍对济南冬天的总体印象是______",opts:["温情","寒冷","炎热","荒凉"],a:0,sol:"答案 温情。老舍用响晴和温晴，温晴既写天气暖和又写济南的人情味，是贯穿全文的文眼。"},{type:"choice",tag:"字音",q:"下列加点字读音完全正确的一项是______",opts:["伦敦dūn　宽敞chǎng","伦敦dūn　宽敞chàng","伦敦dùn　宽敞chǎng","伦敦dùn　宽敞chàng"],a:0,sol:"答案 伦敦 dūn，敞读 chǎng。宽敞是《济南的冬天》高频词，敞字第三声容易读错。"},{type:"fill",tag:"默写",q:"《闻王昌龄左迁龙标遥有此寄》：我寄愁心与明月，______。",a:"随君直到夜郎西",accept:["随君直到夜郎西","随风直到夜郎西"],sol:"随君直到夜郎西（部分版本作随风，都对）。李白把愁心寄托给明月陪伴好友，浪漫主义手法，考理解性默写。"},{type:"choice",tag:"修辞",q:"一个老城，有山有水，全在天底下晒着阳光，暖和安适地睡着，只等春风来把它们唤醒。修辞是______",opts:["拟人","比喻","夸张","对偶"],a:0,sol:"答案 拟人。睡着、唤醒都是人的行为，赋予老城生命感。老舍散文里拟人处处都是，这是语言温情的来源。"},{type:"fill",tag:"成语",q:"写出成语（比喻夫妻失散或决裂后重新团聚）：______",a:"破镜重圆",accept:["破镜重圆"],sol:"答案 破镜重圆。南朝陈乐昌公主与徐德言各执半镜重聚的故事，专用于夫妻之间，不能用于普通朋友。"},{type:"fill",tag:"字形",q:"根据拼音写汉字：他的话里带着讥fěng（  ）",a:"讽",accept:["讽"],sol:"答案是 讽。讥讽的讽，言字旁加风。讽刺、嘲讽、冷嘲热讽都是这个字。"}]},{topic:"秋天的怀念 + 病句成语",qs:[{type:"choice",tag:"课文理解",q:"《秋天的怀念》中母亲说咱娘儿俩在一块儿，好好儿活，深层含义是______",opts:["安慰儿子珍惜生命活出意义","让儿子放弃写作","让儿子早点睡觉","让儿子自己照顾自己"],a:0,sol:"答案 安慰儿子珍惜生命活出意义。史铁生双腿瘫痪后脾气暴怒，母亲自己肝疼得整宿睡不着却隐瞒病情，用好好儿活告诉儿子无论遭遇什么都要活出意义。北海的菊花是全文线索。"},{type:"fill",tag:"默写",q:"《江南逢李龟年》：正是江南好风景，______。",a:"落花时节又逢君",accept:["落花时节又逢君"],sol:"落花时节又逢君。杜甫在江南重逢李龟年，落花时节一语双关：既指暮春时节，又暗指二人晚景凋零、大唐由盛转衰。"},{type:"choice",tag:"字音",q:"下列加点字读音完全正确的一项是______",opts:["侍弄shì　捶打chuí","侍弄shì　捶打cuí","侍弄sì　捶打chuí","侍弄sì　捶打cuí"],a:0,sol:"答案 侍弄 shì，捶打 chuí。侍是侍奉的意思，读 shì 不读 sì。《秋天的怀念》里侍弄花草是母亲未了的心愿。"},{type:"choice",tag:"病句",q:"我们要养成认真学习。病因是______",opts:["缺少宾语","缺少主语","搭配不当","语序不当"],a:0,sol:"答案 缺少宾语。养成后面缺宾语中心语，应补上……的习惯。养成只和习惯、态度这类名词搭配。"},{type:"fill",tag:"成语",q:"写出成语（事情突然发生来不及防备）：这场变故来得太突然，让人______。",a:"猝不及防",accept:["猝不及防"],sol:"答案 猝不及防。猝是突然，防是防备。猝读 cù 不读 cuì。"},{type:"fill",tag:"字形",q:"根据拼音写汉字：深秋的落叶铺满小路，别有一番yùn（  ）味",a:"韵",accept:["韵"],sol:"答案是 韵。韵味、音韵、神韵都是这个韵。"}]}]}();
!function(){"use strict";window.ENG1_POOL=[{topic:"自我介绍 Making Friends",data:{title:"Making Friends",intro:"Unit 1 话题 · 交新朋友、做自我介绍。",sents:[{en:"Hello, my name is Li Ming.",cn:"你好，我叫李明。"},{en:"I am twelve years old this year.",cn:"我今年十二岁。"},{en:"I come from Beijing, the capital of China.",cn:"我来自北京，中国的首都。"},{en:"There are three people in my family.",cn:"我家有三口人。"},{en:"I like playing basketball after class.",cn:"我喜欢课后打篮球。"},{en:"My favourite subject is English.",cn:"我最喜欢的科目是英语。"}],vocab:[["subject","n. 科目"],["favourite","adj. 最喜欢的"],["capital","n. 首都"],["after class","课后"],["basketball","n. 篮球"],["family","n. 家庭"]]}},{topic:"学校生活 My New School",data:{title:"My New School",intro:"Unit 2 话题 · 新学校、图书馆、课程表。",sents:[{en:"Our school is big and beautiful.",cn:"我们的学校又大又美。"},{en:"There is a big library on the first floor.",cn:"一楼有一个大图书馆。"},{en:"I often borrow books from the library.",cn:"我经常从图书馆借书。"},{en:"We have four classes in the morning.",cn:"我们上午上四节课。"},{en:"My best friend sits next to me.",cn:"我最好的朋友坐我旁边。"},{en:"After school, we play football together.",cn:"放学后我们一起踢足球。"},{en:"I love my new school very much.",cn:"我非常喜欢我的新学校。"}],vocab:[["library","n. 图书馆"],["borrow","v. 借入"],["floor","n. 楼层"],["together","adv. 一起"],["next to","紧邻，在旁边"],["after school","放学后"]]}},{topic:"家庭 Family Members",data:{title:"My Family",intro:"Unit 2 话题 · 介绍家人、职业。",sents:[{en:"This is a photo of my family.",cn:"这是一张我家人的照片。"},{en:"The tall man is my father.",cn:"那个高个子男人是我爸爸。"},{en:"He works in a hospital nearby.",cn:"他在附近一家医院工作。"},{en:"My mother cooks delicious food for us.",cn:"我妈妈给我们做美味的饭菜。"},{en:"My little sister is only five years old.",cn:"我妹妹只有五岁。"},{en:"We often watch TV on Sunday evenings.",cn:"我们常在周日晚上看电视。"},{en:"I have a happy family.",cn:"我有一个幸福的家。"}],vocab:[["photo","n. 照片"],["hospital","n. 医院"],["delicious","adj. 美味的"],["only","adv. 仅仅，只有"],["evening","n. 晚上"],["happy","adj. 幸福的"]]}},{topic:"日常生活 Daily Routine",data:{title:"My Day",intro:"Unit 3 话题 · 作息时间。",sents:[{en:"I usually get up at six thirty.",cn:"我通常六点半起床。"},{en:"After breakfast, I go to school by bike.",cn:"早饭后我骑自行车去上学。"},{en:"Classes begin at eight o'clock.",cn:"八点开始上课。"},{en:"At noon, I have lunch at school.",cn:"中午我在学校吃午饭。"},{en:"In the afternoon, we have PE and music.",cn:"下午我们上体育课和音乐课。"},{en:"I do my homework before dinner.",cn:"晚饭前我做作业。"},{en:"I go to bed at nine thirty every night.",cn:"我每晚九点半睡觉。"}],vocab:[["usually","adv. 通常"],["by bike","骑自行车"],["begin","v. 开始"],["noon","n. 中午"],["homework","n. 家庭作业"],["bedtime","n. 就寝时间"]]}},{topic:"兴趣爱好 Hobbies",data:{title:"My Hobby",intro:"Unit 3 话题 · 兴趣爱好。",sents:[{en:"Everyone has his own hobby.",cn:"每个人都有自己的爱好。"},{en:"My hobby is reading books.",cn:"我的爱好是读书。"},{en:"I read story books on weekends.",cn:"我周末读故事书。"},{en:"Reading makes me smart and happy.",cn:"阅读让我聪明又快乐。"},{en:"My friend Tom likes drawing pictures.",cn:"我的朋友Tom喜欢画画。"},{en:"We often share our hobbies with each other.",cn:"我们经常互相分享爱好。"},{en:"A good hobby makes life colorful.",cn:"好爱好让生活多彩。"}],vocab:[["hobby","n. 爱好"],["weekend","n. 周末"],["smart","adj. 聪明的"],["draw","v. 画画"],["share","v. 分享"],["colorful","adj. 多彩的"]]}},{topic:"学校设施 School Places",data:{title:"Our Classroom",intro:"Unit 2 话题 · 教室与设施。",sents:[{en:"Our classroom is on the second floor.",cn:"我们的教室在二楼。"},{en:"There are forty desks and chairs in it.",cn:"里面有四十张桌椅。"},{en:"A blackboard hangs on the front wall.",cn:"前墙上挂着一块黑板。"},{en:"We clean the classroom every day.",cn:"我们每天打扫教室。"},{en:"The plants near the window are green.",cn:"窗边的植物绿油油的。"},{en:"I sit in the third row.",cn:"我坐第三排。"},{en:"It is a clean and bright classroom.",cn:"这是一间干净明亮的教室。"}],vocab:[["classroom","n. 教室"],["blackboard","n. 黑板"],["clean","v. 打扫 adj. 干净的"],["plant","n. 植物"],["row","n. 排"],["bright","adj. 明亮的"]]}},{topic:"食物与三餐 Food and Meals",data:{title:"Three Meals a Day",intro:"Unit 6 话题 · 三餐与健康饮食。",sents:[{en:"I have bread and milk for breakfast.",cn:"我早餐吃面包喝牛奶。"},{en:"For lunch, I like rice with vegetables.",cn:"午饭我喜欢米饭配蔬菜。"},{en:"My mother says vegetables are healthy.",cn:"我妈妈说蔬菜很健康。"},{en:"I drink a glass of water after sports.",cn:"运动后我喝一杯水。"},{en:"We have dinner at about seven.",cn:"我们大约七点吃晚饭。"},{en:"Too much sugar is bad for teeth.",cn:"太多糖对牙齿不好。"},{en:"Healthy food helps us grow strong.",cn:"健康的食物帮我们长强壮。"}],vocab:[["breakfast","n. 早餐"],["vegetable","n. 蔬菜"],["healthy","adj. 健康的"],["glass","n. 玻璃杯"],["sugar","n. 糖"],["strong","adj. 强壮的"]]}}]}();
