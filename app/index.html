<script>!function(){"use strict";window.CN5_POOL=[{topic:"白鹭 + 看拼音写词语",qs:[{type:"fill",tag:"看拼音写词语",q:"看拼音写词：bái lù（  ）",a:"白鹭",accept:["白鹭"],sol:"白鹭。鹭是鸟字底下面加路，五上第一课课题。郭沫若说白鹭是一首精巧的诗。"},{type:"choice",tag:"课文理解",q:"白鹭一文说白鹭是一首精巧的诗，是因为它______",opts:["色素的适宜、身段的大小都很匀称","会写诗","羽毛雪白","会唱歌"],a:0,sol:"答案 色素适宜、身段匀称。素之一忽则嫌白，黛之一忽则嫌黑，增一分减一分都不合适，恰到好处就是精巧。"},{type:"fill",tag:"看拼音写词语",q:"看拼音写词：yíng huǒ chóng（  ）",a:"萤火虫",accept:["萤火虫"],sol:"萤火虫。萤字上草字头下冖再虫。夏夜萤火虫是白鹭一课的课后词语。"},{type:"fill",tag:"古诗默写",q:"《蝉》虞世南：垂緌饮清露，______。",a:"流响出疏桐",accept:["流响出疏桐"],sol:"流响出疏桐。蝉声从稀疏的梧桐树里流出来。緌是古人帽带打结后下垂的部分。"},{type:"fill",tag:"看拼音写词语",q:"看拼音写词：shì hào（  ）（特殊的爱好，2字）",a:"嗜好",accept:["嗜好"],sol:"嗜好。嗜是口字旁加老省，特殊的爱好。白鹭里有孤独地站立于小树的绝顶，看来像不安稳，而它却很悠然一句。"},{type:"choice",tag:"比喻句判断",q:"下列句子是比喻句的是______",opts:["天上的云像棉花糖","他好像生病了","月亮躲在云里睡着了","妹妹的脸像红苹果一样红"],a:0,sol:"答案 天上的云像棉花糖。云和棉花糖是两种不同事物，构成比喻。他好像生病了是推测。月亮睡着了是拟人。妹妹的脸像红苹果也是比喻，但本题选最典型、喻体最明确的 A。"}]},{topic:"落花生 + 关联词",qs:[{type:"choice",tag:"课文理解",q:"落花生中父亲说花生最可贵是因为它______",opts:["果实埋在地里，朴实无华默默奉献","花生长得好看","花生的价格贵","花生的味道甜"],a:0,sol:"答案 果实埋在地里，朴实无华。父亲借花生告诉孩子：人要做有用的人，不要做只讲体面而对别人没有好处的人。借物喻人是本文核心写法。"},{type:"fill",tag:"看拼音写词语",q:"看拼音写词：fēn fù（  ）（嘱咐、吩咐，2字）",a:"吩咐",accept:["吩咐"],sol:"吩咐。吩是口字旁加分，咐是口字旁加付。落花生里父亲吩咐我们过收获节。"},{type:"fill",tag:"看拼音写词语",q:"看拼音写词：ài mù（  ）（喜爱、羡慕，2字）",a:"爱慕",accept:["爱慕"],sol:"爱慕。落花生原文：那晚上天色不大好，可是父亲也来了，实在很难得。爱慕虚荣是它的贬义用法。"},{type:"choice",tag:"关联词",q:"选关联词填空：______只讲体面，______对别人没有好处，那样的人是无用的。（落花生原意）",opts:["如果……就……","只有……才……","虽然……但是……","因为……所以……"],a:0,sol:"答案 如果……就……。假设关系。假设只讲体面而对别人没有好处，就是无用的人。关联词题先判断前后分句是假设、条件、转折还是因果。"},{type:"fill",tag:"看拼音写词语",q:"看拼音写词：fēn biàn（  ）（辩解、说明，2字）",a:"分辩",accept:["分辩","分辨"],sol:"分辩，用言语辩解说明。注意和分辨（用眼睛区分）区分。落花生的课后词语辨析是考点。"},{type:"fill",tag:"古诗默写",q:"《乞巧》林杰：七夕今宵看碧霄，______。",a:"牵牛织女渡河桥",accept:["牵牛织女渡河桥"],sol:"牵牛织女渡河桥。七夕牛郎织女鹊桥相会。宵是夜，霄是云霄，两字易混，考前重点看。"}]},{topic:"桂花雨 + 日积月累",qs:[{type:"fill",tag:"看拼音写词语",q:"看拼音写词：gāo bǐng（  ）（一种糕点，2字）",a:"糕饼",accept:["糕饼"],sol:"糕饼。桂花雨里母亲晒桂花做糕饼。糕是米字旁加羔，饼是食字旁加并。"},{type:"choice",tag:"课文理解",q:"桂花雨里母亲说这里的桂花再香，也比不上家乡院子里的桂花，原因是______",opts:["母亲对家乡的思念之情","家乡桂花真的更香","这里的桂花是假的","母亲鼻子不好"],a:0,sol:"答案 思念家乡。桂花香不香不重要，重要的是家乡的回忆。借桂花寄托思乡之情，这是本文核心情感。"},{type:"fill",tag:"看拼音写词语",q:"看拼音写词：chá yè（  ）（泡茶的叶子，2字）",a:"茶叶",accept:["茶叶"],sol:"茶叶。桂花可以泡茶，桂花雨里反复提到桂花茶。"},{type:"fill",tag:"古诗默写",q:"《示儿》陆游：死去元知万事空，______。",a:"但悲不见九州同",accept:["但悲不见九州同"],sol:"但悲不见九州同。只是悲伤看不到全国统一。但在这里是只是的意思。陆游临终嘱咐儿子王师北定中原日，家祭无忘告乃翁。"},{type:"fill",tag:"看拼音写词语",q:"看拼音写词：wán zhěng（  ）（没有损坏缺少，2字）",a:"完整",accept:["完整"],sol:"完整。完是宝盖头下元，整是束+攵+正。桂花雨课后词语。"},{type:"choice",tag:"成语运用",q:"成语使用恰当的一项是______",opts:["桂花盛开，香飘十里，真是沁人心脾","桂花盛开，香飘十里，真是气急败坏","桂花盛开，香飘十里，真是失魂落魄","桂花盛开，香飘十里，真是阴谋诡计"],a:0,sol:"答案 沁人心脾。芳香凉爽怡人。其余三个都是贬义或负面成语，和桂花香的语境完全不符。成语题先看感情色彩。"}]},{topic:"猎人海力布 + 缩句",qs:[{type:"choice",tag:"课文理解",q:"猎人海力布中，海力布变成石头的原因是______",opts:["把听来的话原原本本告诉了乡亲们","被巫师诅咒","他自己想变成石头","不小心吃了仙果"],a:0,sol:"答案 把听来的话原原本本告诉了乡亲们。海力布为救乡亲说出实情，违反宝石的秘密约定，变成石头。牺牲自己救大家，民间故事歌颂的舍己为人精神。"},{type:"fill",tag:"看拼音写词语",q:"看拼音写词：dīng zhǔ（  ）（再三嘱咐，2字）",a:"叮嘱",accept:["叮嘱"],sol:"叮嘱。叮是口字旁加丁，嘱是口字旁加属。小白蛇叮嘱海力布不要告诉别人宝石的秘密。"},{type:"fill",tag:"看 记义写词语",q:"看拼音写词：chóng bài（  ）（尊敬敬重，2字）",a:"崇拜",accept:["崇拜"],sol:"崇拜。崇是山字头加宗。崇拜、崇敬、崇高共用崇字。"},{type:"choice",tag:"缩句",q:"缩句：可爱的海力布毅然变成了僵硬的石头。最简主干是______",opts:["海力布变成石头","海力布变成僵硬的石头","可爱的海力布变成石头","海力布变成了石头"],a:0,sol:"缩句三步：去修饰（可爱的、僵硬的）、去状语（毅然）、去动态助词（了）。主干=海力布+变成+石头。"},{type:"fill",tag:"看拼音写词语",q:"看拼音写词：huǎng hū（  ）（看不真切、神志不清，2字）",a:"恍惚",accept:["恍惚"],sol:"恍惚。竖心旁加忽。神志恍惚、恍惚间。五上语文园地高频词。"},{type:"fill",tag:"歇后语",q:"补充歇后语：小葱拌豆腐——______",a:"一清二白",accept:["一清二白"],sol:"小葱拌豆腐，一清二白。葱白拌豆腐青白分明，比喻清清楚楚清清白白。歇后语前半比喻后半解释。"}]},{topic:"句式变换 + 成语",qs:[{type:"choice",tag:"反问句",q:"把陈述句改为反问句：我们应该爱惜粮食。正确的是______",opts:["难道我们不应该爱惜粮食吗","我们应该爱惜粮食吗","难道我们应该爱惜粮食吗","我们不应该爱惜粮食吗"],a:0,sol:"答案 难道我们不应该爱惜粮食吗。反问句改法三步：加难道……不，句号变问号，语气变强但意思不变。"},{type:"fill",tag:"看拼音写词语",q:"看拼音写词：pàn duàn（  ）（判定断定，2字）",a:"判断",accept:["判断"],sol:"判断。判左边是半右边是刀。判断、判别、裁判。"},{type:"fill",tag:"看拼音写词语",q:"看拼音写词：líng hún（  ）（精神灵魂，2字）",a:"灵魂",accept:["灵魂"],sol:"灵魂。灵上面是彐下面是火。魂是云字旁（其实是鬼字旁），云+鬼。灵魂、魂魄、国魂。"},{type:"choice",tag:"修改病句",q:"修改病句：我断定他大概是班长。病因是______",opts:["前后矛盾","搭配不当","语序不当","成分残缺"],a:0,sol:"答案 前后矛盾。断定是肯定判断，大概是不确定，前后矛盾。删掉大概或把断定改成猜测。"},{type:"fill",tag:"成语",q:"写出成语（形容牵挂放心不下，牵肠挂肚）：奶奶总是______地惦记着外地的孙子。",a:"牵肠挂肚",accept:["牵肠挂肚"],sol:"牵肠挂肚。牵是拉，挂是惦记。形容非常牵挂，放不下。五上慈母情深一课情感基调。"},{type:"fill",tag:"成语",q:"写出成语（形容心和手都很灵巧）：妹妹的手真巧，______。",a:"心灵手巧",accept:["心灵手巧"],sol:"心灵手巧。聪明能干手艺巧妙。慈母情深里母亲数钱的手就是心灵手巧的手。"}]},{topic:"古诗三首 + 文学常识",qs:[{type:"fill",tag:"古诗默写",q:"《题临安邸》林升：山外青山楼外楼，______？",a:"西湖歌舞几时休",accept:["西湖歌舞几时休"],sol:"西湖歌舞几时休。西湖边歌舞什么时候才停止。林升用反问讽刺当权者偏安一隅不思恢复中原。"},{type:"fill",tag:"古诗默写",q:"《题临安邸》：暖风熏得游人醉，______。",a:"直把杭州作汴州",accept:["直把杭州作汴州"],sol:"直把杭州作汴州。暖风把游人吹醉了，简直把杭州当成了汴州。熏字是本题易错字，下面四点底。"},{type:"choice",tag:"古诗理解",q:"《己亥杂诗》龚自珍：我劝天公重抖擞，______。横线上应填______",opts:["不拘一格降人才","万紫千红总是春","忙趁东风放纸鸢","怕得鱼惊不应人"],a:0,sol:"答案 不拘一格降人才。我希望上天重新振作，不拘泥于一种规格降下人才。九万里风鹏正举是李清照。"},{type:"choice",tag:"文学常识",q:"下列诗句和节日搭配正确的是______",opts:["乞巧——七夕节","乞巧——重阳节","乞巧——中秋节","乞巧——春节"],a:0,sol:"答案 乞巧对七夕。七夕今宵看碧霄，牵牛织女渡河桥。家家乞巧望秋月，穿尽红丝几万条。乞巧节是农历七月初七。"},{type:"fill",tag:"看拼音写词语",q:"看拼音写词：jì diàn（  ）（为死去的人举行仪式，2字）",a:"祭奠",accept:["祭奠"],sol:"祭奠。祭是上边的月（肉）加又加示字底，奠是酋字头加大字底。示儿里家祭无忘告乃翁的祭。"},{type:"fill",tag:"看拼音写词语",q:"看拼音写词：nài wēng（  ）（你的父亲，文言，2字）",a:"乃翁",accept:["乃翁"],sol:"乃翁。乃是你，翁是父亲。家祭无忘告乃翁：家祭时不要忘记告诉你们的父亲。示儿是陆游绝笔。"}]}]}();
!function(){"use strict";window.ENG5_POOL=[{topic:"Unit 1 老师 My Teachers",data:{title:"My English Teacher",intro:"PEP 五上 Unit 1 · 描述老师的性格与外貌。",sents:[{en:"Miss Wang is my English teacher.",cn:"王老师是我的英语老师。"},{en:"She is young and pretty.",cn:"她年轻又漂亮。"},{en:"She is very kind to us.",cn:"她对我们很和蔼。"},{en:"Her class is so much fun.",cn:"她的课非常有趣。"},{en:"She is strict but helpful.",cn:"她严格但又很帮忙。"},{en:"We all like her very much.",cn:"我们都非常喜欢她。"},{en:"She is our favourite teacher.",cn:"她是我们最喜欢的老师。"}],vocab:[["young","adj. 年轻的"],["kind","adj. 和蔼的"],["strict","adj. 严格的"],["fun","n. 有趣"],["helpful","adj. 有帮助的"],["favourite","adj. 最喜欢的"]]}},{topic:"Unit 1 外貌描述 Describing People",data:{title:"My Best Friend",intro:"PEP 五上 Unit 1 · 描述朋友的外貌和性格。",sents:[{en:"I have a good friend at school.",cn:"我在学校有一个好朋友。"},{en:"He is tall and strong.",cn:"他又高又壮。"},{en:"He has short hair and big eyes.",cn:"他留着短发，有大大的眼睛。"},{en:"He is very hard-working.",cn:"他非常勤奋。"},{en:"He often helps me with my maths.",cn:"他经常帮我学数学。"},{en:"We play basketball after school.",cn:"我们放学后打篮球。"},{en:"He is polite and clever.",cn:"他有礼貌又聪明。"}],vocab:[["tall","adj. 高的"],["strong","adj. 强壮的"],["hard-working","adj. 勤奋的"],["polite","adj. 有礼貌的"],["clever","adj. 聪明的"],["help…with","帮助某人做某事"]]}},{topic:"Unit 2 一周安排 My Week",data:{title:"My Week",intro:"PEP 五上 Unit 2 · 星期与课程安排。",sents:[{en:"We go to school from Monday to Friday.",cn:"我们周一到周五上学。"},{en:"We have Chinese, maths and English every day.",cn:"我们每天上语文、数学和英语。"},{en:"I like Wednesdays best.",cn:"我最喜欢周三。"},{en:"Because we have a PE class on Wednesday.",cn:"因为周三我们有体育课。"},{en:"On the weekend, I do homework and read books.",cn:"周末我做作业、读书。"},{en:"I often wash my clothes on Sundays.",cn:"我常在周日洗衣服。"},{en:"Saturday is my favourite day.",cn:"周六是我最喜欢的一天。"}],vocab:[["Monday","n. 周一"],["Wednesday","n. 周三"],["weekend","n. 周末"],["wash","v. 洗"],["homework","n. 作业"],["favourite","adj. 最喜欢的"]]}},{topic:"Unit 2 周末活动 Weekends",data:{title:"My Weekend Plan",intro:"PEP 五上 Unit 2 · 谈论周末做什么。",sent
