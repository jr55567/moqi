<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>二升三暑假补习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a12;--surface:#12121f;--ink:#f0e6ff;--ink2:#9888b8;--muted:#5c5078;--border:rgba(200,150,255,0.1);--pink:#FF2D95;--purple:#A855F7;--cyan:#00E5FF;--green:#39FF14;--orange:#FF9500;--radius:18px;--radius-sm:10px;--font-display:'Orbitron',sans-serif;--font-body:'Plus Jakarta Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{-webkit-overflow-scrolling:touch;overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:inherit;touch-action:manipulation;-webkit-appearance:none;appearance:none}
body{font:15px/1.6 var(--font-body);background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;justify-content:center;background-image:radial-gradient(ellipse 60% 40% at 30% 20%,rgba(255,45,149,0.06),transparent 60%),radial-gradient(ellipse 50% 30% at 70% 80%,rgba(255,149,0,0.04),transparent 60%)}
.app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;position:relative}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.screen{display:none;flex-direction:column;flex:1}.screen.active{display:flex}

.header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;background:rgba(10,10,18,0.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.header h1{font:500 16px/1.2 var(--font-display);letter-spacing:0.04em;background:linear-gradient(135deg,var(--pink),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .back{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--ink2);cursor:pointer;font-size:16px}
.star-badge{padding:5px 12px;border-radius:999px;background:rgba(255,230,109,0.1);border:1px solid rgba(255,230,109,0.2);font:700 11px/1 var(--font-display);color:#FFE66D;letter-spacing:0.06em}

.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;flex:1;align-content:start}
.hero-banner{grid-column:1/-1;text-align:center;padding:20px 0 12px}
.hero-banner .mascot{font-size:44px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(255,149,0,0.4))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero-banner .greeting{font:700 22px/1.3 var(--font-display);letter-spacing:0.06em;margin-top:4px;background:linear-gradient(135deg,var(--pink),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-banner .sub{font:500 12px/1.4 var(--font-body);color:var(--ink2)}

.subj-card{background:var(--surface);border-radius:var(--radius);padding:18px 14px;cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--border);transition:transform 0.2s}
.subj-card:active{transform:scale(0.95)}
.subj-card .card-glow{position:absolute;top:-30%;right:-20%;width:80px;height:80px;border-radius:50%;opacity:0.08;pointer-events:none}
.subj-card .card-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;margin-bottom:8px}
.subj-card .card-name{font:700 14px/1.2 var(--font-body)}
.subj-card .card-desc{font:500 10px/1.3 var(--font-body);color:var(--ink2);margin-top:2px}
.subj-card .card-progress{margin-top:8px;height:4px;border-radius:999px;background:rgba(255,255,255,0.06);overflow:hidden}
.subj-card .card-progress span{display:block;height:100%;border-radius:999px;transition:width 0.3s}

.read-banner{grid-column:1/-1;background:linear-gradient(135deg,rgba(0,229,255,0.06),rgba(168,85,247,0.06));border:1px solid rgba(0,229,255,0.15);border-radius:var(--radius);padding:18px;cursor:pointer;position:relative;overflow:hidden}
.read-banner .rb-label{font:700 10px/1 var(--font-display);letter-spacing:0.14em;color:var(--cyan);text-transform:uppercase;margin-bottom:6px}
.read-banner .rb-title{font:700 16px/1.3 var(--font-body)}
.read-banner .rb-preview{font:500 12px/1.4 var(--font-body);color:var(--ink2);margin-top:3px}
.read-banner .rb-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--cyan);animation:pulse-arrow 1.5s ease-in-out infinite}
@keyframes pulse-arrow{0%,100%{transform:translateY(-50%) translateX(0)}50%{transform:translateY(-50%) translateX(5px)}}

.summary-card{grid-column:1/-1;margin-top:4px;background:linear-gradient(135deg,var(--surface),rgba(255,149,0,0.06));border:1px solid rgba(255,149,0,0.15);border-radius:var(--radius);padding:18px}
.summary-card .sum-title{font:700 13px/1 var(--font-display);letter-spacing:0.06em;color:var(--orange);margin-bottom:12px}
.summary-card .sum-row{display:flex;gap:12px;margin-bottom:12px}
.sum-num{flex:1;text-align:center;padding:10px;background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border)}
.sum-num .n{font:700 20px/1 var(--font-display)}.sum-num .l{font:500 10px/1 var(--font-body);color:var(--ink2);margin-top:4px}
.sum-bar-wrap{height:6px;border-radius:999px;background:rgba(255,255,255,0.05);overflow:hidden;margin-bottom:10px}
.sum-bar-wrap span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--purple),var(--cyan))}

.q-progress{margin:10px 16px 0;height:5px;border-radius:999px;background:rgba(255,255,255,0.05);overflow:hidden}
.q-progress span{display:block;height:100%;border-radius:999px}
.q-card{margin:10px 16px;padding:20px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border)}
.q-card .q-num{font:700 10px/1 var(--font-display);letter-spacing:0.12em;margin-bottom:8px}
.q-card .q-text{font:600 15px/1.5 var(--font-body);margin-bottom:14px}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer;font:500 13px/1.3 var(--font-body);text-align:left;transition:all 0.2s;color:var(--ink)}
.q-opt:active{transform:scale(0.98)}
.q-opt.ok{border-color:var(--green);background:rgba(57,255,20,0.06)}
.q-opt.nope{border-color:var(--pink);background:rgba(255,45,149,0.06)}
.q-opt.no-click{pointer-events:none}
.hint-box{margin:8px 16px;padding:12px 14px;background:rgba(255,149,0,0.06);border-radius:var(--radius-sm);border:1px solid rgba(255,149,0,0.15);font:500 12px/1.4 var(--font-body);color:var(--orange);display:none}
.hint-box.show{display:block}
.hint-btn{margin:8px 16px;padding:10px;border-radius:var(--radius-sm);border:1px dashed var(--border);background:transparent;font:600 12px/1 var(--font-body);color:var(--ink2);cursor:pointer;width:calc(100% - 32px);text-align:center}
.fb{margin:4px 16px 10px;padding:12px 14px;border-radius:var(--radius-sm);text-align:center;font:600 13px/1.3 var(--font-body);display:none}
.fb.show{display:block}
.fb.ok{background:rgba(57,255,20,0.06);color:var(--green);border:1px solid rgba(57,255,20,0.15)}
.fb.bad{background:rgba(255,45,149,0.06);color:var(--pink);border:1px solid rgba(255,45,149,0.15)}
.q-nav{display:flex;gap:7px;padding:8px 16px 18px}
.q-nav button{flex:1;padding:13px;border-radius:var(--radius-sm);border:none;font:700 13px/1 var(--font-display);cursor:pointer;letter-spacing:0.04em}
.btn-prev{background:var(--surface);color:var(--ink2);border:1px solid var(--border)}
.btn-next{background:linear-gradient(135deg,var(--pink),#FF6B9D);color:#fff}
.btn-finish{background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff}
.result-card{margin:16px;padding:32px 24px;background:var(--surface);border-radius:var(--radius);text-align:center;border:1px solid var(--border)}
.result-card .score{font:900 52px/1 var(--font-display)}

.read-card{margin:12px 16px;padding:20px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border)}
.read-card .scene-content{font:500 15px/1.9 var(--font-body);color:var(--ink)}
.read-card .scene-explain{margin-top:12px;padding:10px 14px;background:rgba(255,149,0,0.06);border-radius:8px;border-left:3px solid var(--orange);font:500 13px/1.6 var(--font-body);color:var(--ink2)}
.read-pager{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;margin:0 16px;font:500 11px/1 var(--font-body);color:var(--ink2)}
.read-dots{display:flex;gap:6px}
.read-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.15)}
.read-dot.active{background:var(--cyan);box-shadow:0 0 8px rgba(0,229,255,0.4)}
.read-nav-btn{padding:9px 18px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink2);font:700 12px/1 var(--font-body);cursor:pointer}
.tts-btn{margin:8px 16px 0;padding:8px 16px;border-radius:999px;border:1px solid var(--cyan);background:rgba(0,229,255,0.08);color:var(--cyan);font:700 12px/1 var(--font-body);cursor:pointer;display:flex;align-items:center;gap:6px}
.tts-btn.playing{background:rgba(0,229,255,0.15);box-shadow:0 0 16px rgba(0,229,255,0.2);animation:pulse-glow 1s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 8px rgba(0,229,255,0.15)}50%{box-shadow:0 0 20px rgba(0,229,255,0.35)}}
@keyframes spring-up{0%{opacity:0;transform:translateY(16px) scale(0.95)}60%{opacity:1;transform:translateY(-2px) scale(1.01)}100%{opacity:1;transform:translateY(0) scale(1)}}
.stagger{opacity:0;transform:translateY(12px)}.stagger.show{animation:spring-up 0.4s cubic-bezier(0.2,0,0,1) forwards}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--muted);border-radius:999px}
</style>
</head>
<body>
<div class="app">
<div class="screen active" id="home">
  <div class="header" style="border-bottom:none"><h1>暑假<span style="font:500 12px/1 var(--font-body);color:var(--ink2);margin-left:6px">二升三冲刺</span></h1><div class="star-badge">⭐ <span id="starCount">0</span></div></div>
  <div class="home-grid" id="homeGrid"></div>
</div>
<div class="screen" id="practice">
  <div class="header"><div class="back" onclick="goHome()">←</div><h1 id="ptitle"></h1><div id="pcounter" style="font:500 12px/1 var(--font-display);color:var(--ink2)"></div></div>
  <div class="q-progress"><span id="pbar" style="width:0%"></span></div>
  <div id="pcontent" style="flex:1;overflow-y:auto"></div>
  <div class="q-nav" id="pnav"></div>
</div>
<div class="screen" id="reading">
  <div class="header"><div class="back" onclick="goHome()">←</div><h1 id="rtitle">📖 每日阅读</h1><div id="rprog" style="font:500 12px/1 var(--font-display);color:var(--ink2)"></div></div>
  <div id="rcontent" style="flex:1;overflow-y:auto"></div>
</div>
</div>

<script>
// ── QUESTION POOLS (50+ each, seeded per day, pick 10) ──
function srand(seed){var x=Math.sin(seed)*10000;return x-Math.floor(x)}
function shuffleBySeed(arr,seed){var c=arr.slice(),m=c.length,t,i;while(m){i=Math.floor(srand(seed+m)*m--);t=c[m];c[m]=c[i];c[i]=t}return c}

var CHINESE_POOL=[
  {q:'"春天"的"春"字有几画？',o:['8画','9画','10画','11画'],a:1,h:'春=三+人+日'},
  {q:'选出正确的字：__天',o:['晴','睛','情','请'],a:0,h:'晴天的晴是日字旁'},
  {q:'"美丽"的近义词是？',o:['漂亮','丑陋','高大','矮小'],a:0,h:'美和丽都是好看的意思'},
  {q:'"他跑得很快"中"得"的用法？',o:['连接动词和补语','表示得到','连接名词','表示可以'],a:0,h:'"跑"是动词，"很快"说明跑得怎么样'},
  {q:'"一棵大树"中"棵"是什么词？',o:['量词','名词','动词','形容词'],a:0,h:'棵、个、只、条都是量词'},
  {q:'选出正确的字：__午',o:['下','夏','吓','虾'],a:0,h:'下午的"下"'},
  {q:'"鲜艳"的"艳"字部首是？',o:['丰','色','一','阝'],a:1,h:'艳=丰+色，部首是色'},
  {q:'"温暖"的反义词是？',o:['寒冷','炎热','凉爽','闷热'],a:0,h:'温暖的反面是冷'},
  {q:'用"因为…所以…"造句',o:['因为下雨了，所以我们没去公园。','所以下雨了，因为我们没去公园。','因为没去公园，所以下雨了。','我们因为所以没去公园。'],a:0,h:'因为=原因，所以=结果'},
  {q:'"一位老师"中的"位"跟哪个最像？',o:['个','条','只','双'],a:0,h:'位和个都是人数量词'},
  {q:'选出正确的成语：画蛇__足',o:['添','加','增','补'],a:0,h:'画蛇添足'},
  {q:'下面哪个字不是左右结构？',o:['吃','唱','园','叫'],a:2,h:'园是全包围结构'},
  {q:'"五颜六色"形容什么？',o:['颜色很多','五种颜色','六种颜色','颜色很少'],a:0,h:'形容色彩丰富'},
  {q:'"绿油油"是什么类型的词？',o:['ABB式','AABB式','ABAB式','AAB式'],a:0,h:'ABB式的词'},
  {q:'下面哪个是完整的句子？',o:['小明在教室里。','在教室里。','小明教室里。','在教室小明。'],a:0,h:'完整句子要有主语+谓语'},
  {q:'"千山鸟飞绝"的作者是？',o:['柳宗元','李白','杜甫','王维'],a:0,h:'《江雪》柳宗元'},
  {q:'下面哪个字不是多音字？',o:['长','乐','好','山'],a:3,h:'长、乐、好都是多音字'},
  {q:'"他高兴得跳了起来"用的修辞？',o:['夸张','比喻','拟人','排比'],a:0,h:'高兴得跳起来是夸张'},
  {q:'选出正确的词组',o:['一条鱼','一只鱼','一头鱼','一个鱼'],a:0,h:'鱼用"条"'},
  {q:'"津津有味"形容什么？',o:['吃东西很香','走路很快','唱歌好听','画画漂亮'],a:0,h:'形容吃得很有滋味'},
  {q:'"兴高采烈"形容什么？',o:['非常高兴','非常难过','非常生气','非常累'],a:0,h:'高兴的样子'},
  {q:'选出正确搭配：一__书',o:['本','个','条','只'],a:0,h:'书用"本"'},
  {q:'"彩虹"的"虹"字部首是？',o:['虫','工','红','纟'],a:0,h:'虹的部首是虫'},
  {q:'"大吃一惊"意思？',o:['非常惊讶','一点不惊讶','非常生气','非常高兴'],a:0,h:'吃一惊=吓一跳'},
  {q:'下面哪个是动词？',o:['跑','大','红','一'],a:0,h:'跑是动作，是动词'},
  {q:'"四面八方"的"四"和"八"表示？',o:['各个方向','四个方向','八个方向','十二个方向'],a:0,h:'泛指各个方向'},
  {q:'选出反义词：粗——？',o:['细','胖','长','短'],a:0,h:'粗的反面是细'},
  {q:'"不慌不忙"中"慌"的意思？',o:['慌张','匆忙','高兴','害怕'],a:0,h:'慌=慌张，反义=从容'},
  {q:'选出正确的关联词：__天气不好，__运动会延期了。',o:['因为…所以…','虽然…但是…','不但…而且…','如果…就…'],a:0,h:'原因→结果=因为…所以…'},
  {q:'"自言自语"是什么意思？',o:['自己对自己说话','和别人说话','大声说话','不说话'],a:0,h:'自=自己，言=说，自语=对自己说'},
  {q:'"依依不舍"形容什么？',o:['舍不得离开','很不开心','很着急','很兴奋'],a:0,h:'依依=留恋，不舍=舍不得'},
  {q:'选出正确的字：__望',o:['期','旗','其','欺'],a:0,h:'期望的期'},
  {q:'"白发苍苍"中的"苍苍"是？',o:['灰白色','青色','绿色','红色'],a:0,h:'苍苍=灰白的样子'},
  {q:'下面哪个是ABB式词语？',o:['红彤彤','干干净净','高兴高兴','学习学习'],a:0,h:'ABB=红彤彤、绿油油'},
  {q:'"人山人海"用了什么修辞？',o:['夸张','比喻','拟人','排比'],a:0,h:'人像山和海一样多=夸张'},
  {q:'选出正确的字：__法',o:['办','为','力','方'],a:0,h:'办法的办'},
  {q:'"专心致志"的意思？',o:['注意力非常集中','三心二意','边玩边学','不学习'],a:0,h:'专心=注意力集中'},
  {q:'下面哪个是寓言故事？',o:['画蛇添足','静夜思','悯农','春晓'],a:0,h:'画蛇添足是寓言'},
  {q:'"心花怒放"中的"花"指什么？',o:['心情像花开一样高兴','真正的花','画画','花朵'],a:0,h:'形容心情非常好'},
  {q:'选出正确的字：__业',o:['作','昨','炸','咋'],a:0,h:'作业的作'},
  {q:'"风和日丽"形容什么天气？',o:['晴朗微风','狂风暴雨','乌云密布','大雪纷飞'],a:0,h:'风和=微风，日丽=阳光好'},
  {q:'下面哪个不是ABB式？',o:['干干净净','白花花','绿油油','红彤彤'],a:0,h:'干干净净是AABB'},
  {q:'"狐假虎威"中的"假"意思是？',o:['借','假的','假装','假的'],a:0,h:'假=借，狐狸借老虎的威风'},
  {q:'选出正确的字：__天',o:['今','令','另','金'],a:0,h:'今天的今'},
  {q:'"万紫千红"形容什么季节？',o:['春天','夏天','秋天','冬天'],a:0,h:'万紫千红总是春'},
  {q:'下面哪个是成语？',o:['画蛇添足','红彤彤','慢慢地','高兴地'],a:0,h:'画蛇添足是四字成语'},
  {q:'"胸有成竹"的意思？',o:['做事很有把握','心里有竹子','很害怕','不确定'],a:0,h:'比喻做事前已经有完整计划'},
  {q:'选出正确的字：__见',o:['再','在','载','栽'],a:0,h:'再见的再'},
  {q:'"目不转睛"的意思？',o:['看得很专注','眼睛转不动','闭着眼睛','眨眼睛'],a:0,h:'不转睛=眼睛不转，很专注'},
  {q:'下面哪个是多音字？',o:['行','山','天','水'],a:0,h:'行=xíng（行走）/háng（银行）'},
];

var MATH_POOL=[
  {q:'6×7=?',o:['42','36','48','35'],a:0,h:'六七四十二'},
  {q:'56÷8=?',o:['6','7','8','9'],a:1,h:'七八五十六'},
  {q:'3盒铅笔每盒8支共？',o:['24支','18支','11支','32支'],a:0,h:'3×8=24'},
  {q:'45÷5=?',o:['7','8','9','10'],a:2,h:'五九四十五'},

function checkDayReset(){
  var today=new Date().toISOString().split('T')[0];
  var last=ld(gk('','lastDate'),'');

    sv(gk('','lastDate'),today);
  }
}

  html+='<div class="sum-num"><div class="n" style="color:'+(ch>=10?'var(--green)':'var(--pink)')+'">'+ch+'/10</div><div class="l">语文</div></div>';
  html+='<div class="sum-num"><div class="n" style="color:'+(mh>=10?'var(--green)':'var(--purple)')+'">'+mh+'/10</div><div class="l">数学</div></div>';
  html+='<div class="sum-num"><div class="n" style="color:'+(en>=10?'var(--green)':'var(--cyan)')+'">'+en+'/10</div><div class="l">英语</div></div>';
  html+='</div><div class="sum-bar-wrap"><span style="width:'+pct+'%"></span></div>';
  if(pct<100){html+='<div style="margin-top:10px;padding:8px 12px;background:rgba(255,45,149,0.06);border-radius:8px;font:500 11px/1.4 var(--font-body);color:var(--pink)">💡 还有 <b>'+(tt-td)+'</b> 题！每答对1题 ⭐+1</div>';}
  else{html+='<div style="margin-top:10px;padding:8px 12px;background:rgba(57,255,20,0.06);border-radius:8px;font:500 11px/1.4 var(--font-body);color:var(--green)">🌟 全部完成！今天学了 '+td+' 道题！</div>';}
  html+='</div>';
  grid.innerHTML=html;
  setTimeout(function(){document.querySelectorAll('#homeGrid .stagger').forEach(function(el,i){setTimeout(function(){el.classList.add('show')},i*70)})},80);
}

function openPractice(sid){
  checkDayReset();refreshTodayQS();
  SUBJECTS[0].qs=todayChinese;SUBJECTS[1].qs=todayMath;SUBJECTS[2].qs=todayEnglish;
  pm=SUBJECTS.find(function(x){return x.id===sid});if(!pm)return;
  pq=0;ps=0;pdone=false;panswer=-1;
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});
  document.getElementById('practice').classList.add('active');document.getElementById('ptitle').textContent=pm.name;renderQ();
}
function qtotal(){return pm.qs.length}
function cq(idx){return pm.qs[idx]}
function renderQ(){
  var total=qtotal(),q=cq(pq);if(!q)return;
  document.getElementById('pcounter').textContent=(pq+1)+'/'+total;document.getElementById('pbar').style.width=((pq+1)/total*100)+'%';
  var L=['A','B','C','D'],h='<div class="q-card"><div class="q-num" style="color:'+pm.color+'">第'+(pq+1)+'题/共'+total+'题</div><div class="q-text">'+q.q+'</div><div class="q-options">';
  q.o.forEach(function(o,i){var c='q-opt';if(pdone){c+=' no-click';if(i===q.a)c+=' ok';else if(i===panswer)c+=' nope';}h+='<button class="'+c+'" onclick="selQ('+i+')">'+L[i]+'. '+o+'</button>';});
  h+='</div></div>';if(!pdone){h+='<button class="hint-btn" onclick="document.getElementById(\'hb\').classList.add(\'show\')">💡 查看提示</button><div class="hint-box" id="hb">'+q.h+'</div>';}
  if(pdone){var ok=panswer===q.a;h+='<div class="fb '+(ok?'ok':'bad')+' show">'+(ok?'✅ 正确！':'❌ 正确答案：'+L[q.a]+'. '+q.o[q.a])+'</div>';}
  document.getElementById('pcontent').innerHTML=h;
  var n='';if(pq>0)n+='<button class="btn-prev" onclick="prevQ()">← 上一题</button>';
  if(pq<total-1)n+='<button class="btn-next" onclick="nextQ()">下一题 →</button>';else n+='<button class="btn-finish" onclick="finishP()">完成 ✓</button>';
  document.getElementById('pnav').innerHTML=n;
}
function selQ(i){if(pdone)return;pdone=true;panswer=i;if(i===cq(pq).a){ps++;stars++;sv(gk('','stars'),stars);}sv(gk('','done_'+pm.id),Math.max(ld(gk('','done_'+pm.id),0),pq+1));renderQ();}
function nextQ(){if(pq<qtotal()-1){pq++;pdone=false;renderQ()}}
function prevQ(){if(pq>0){pq--;pdone=false;renderQ()}}
function finishP(){var t=qtotal();document.getElementById('pcontent').innerHTML='<div class="result-card"><div style="font-size:44px;margin-bottom:8px">'+(ps===t?'🌟':'💪')+'</div><div class="score" style="color:'+pm.color+'">'+ps+'/'+t+'</div><div style="font:600 13px var(--font-body);color:var(--ink2);margin-top:6px">正确率 '+Math.round(ps/t*100)+'% · ⭐'+stars+'</div><button class="hint-btn" style="margin:14px auto 0;width:auto;border:1px solid var(--purple);color:var(--purple)" onclick="openPractice(\''+pm.id+'\')">重新练习 →</button></div>';document.getElementById('pnav').innerHTML='';}

function openReading(){ri=0;rpage=0;document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});document.getElementById('reading').classList.add('active');renderRead()}
function renderRead(){
  var rd=READINGS[ri], pg=rd.pages[rpage];
  document.getElementById('rtitle').textContent=rd.icon+' '+rd.title;document.getElementById('rprog').textContent=(ri+1)+'/'+READINGS.length;
  var c=document.getElementById('rcontent'),h='<div class="read-card"><div class="scene-content">'+pg.text+'</div>';
  if(pg.note){h+='<div class="scene-explain">💡 '+pg.note+'</div>';}
  h+='</div><button class="tts-btn" id="ttsBtn" onclick="speakPage()">🔊 跟读</button>';
  h+='<div class="read-pager"><button class="read-nav-btn" '+(rpage>0?'onclick="rpage--;renderRead()"':'disabled style="opacity:0.3"')+'>← 上页</button>';
  h+='<div class="read-dots">';
  for(var i=0;i<rd.pages.length;i++){h+='<div class="read-dot'+(i===rpage?' active':'')+'"></div>';}
  h+='</div>';
  h+='<button class="read-nav-btn"'+(rpage<rd.pages.length-1?'onclick="rpage++;renderRead()"':(ri<READINGS.length-1)?'onclick="ri++;rpage=0;renderRead()"':'disabled style="opacity:0.3"')+'>'+(rpage<rd.pages.length-1?'下页 →':(ri<READINGS.length-1?'下一篇 →':'已完成'))+'</button></div>';
  c.innerHTML=h;
}
function speakPage(){
  var rd=READINGS[ri], pg=rd.pages[rpage], txt=pg.text.replace(/<[^>]*>/g,''), btn=document.getElementById('ttsBtn'),synth=window.speechSynthesis;
  if(!synth)return;if(synth.speaking)synth.cancel();if(btn)btn.classList.add('playing');
  var hasEN=/[a-zA-Z]{2,}/.test(txt),u=new SpeechSynthesisUtterance(txt);
  u.lang=hasEN?'en-US':'zh-CN';u.rate=hasEN?0.7:0.85;u.onend=function(){if(btn)btn.classList.remove('playing')};u.onerror=function(){if(btn)btn.classList.remove('playing')};synth.speak(u);
}

showHome();
</script>
