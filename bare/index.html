<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TTS 裸测</title>
<style>
body{margin:0;padding:22px;background:#000;color:#fff;
     font-family:sans-serif;font-size:17px;line-height:1.6}
h1{font-size:21px;margin:0 0 6px}
p{color:#999;font-size:13px;margin:0 0 22px}
button{display:block;width:100%;padding:28px;margin-bottom:16px;
       border:0;border-radius:12px;font-size:22px;font-weight:bold;
       background:#0af;color:#000}
button:active{background:#08c}
.box{background:#111;border-radius:10px;padding:14px;margin-bottom:10px;font-size:14px}
.k{color:#888;font-size:12px}
.v{font-weight:bold;font-size:16px;word-break:break-all}
.ok{color:#3f6}.bad{color:#f55}.w{color:#fa3}
pre{background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:12px;
    font-size:11px;color:#888;white-space:pre-wrap;max-height:300px;overflow:auto}
</style>
</head>
<body>
<h1>TTS 裸测</h1>
<p>没有任何框架，就三行代码。点了没声音就是系统问题</p>

<button id="b1">🔊 英文 Hello</button>
<button id="b2">🔊 中文 你好</button>

<div class="box"><div class="k">speechSynthesis</div><div class="v" id="a1">?</div></div>
<div class="box"><div class="k">语音数量</div><div class="v" id="a2">?</div></div>
<div class="box"><div class="k">最后结果</div><div class="v" id="a3">未测</div></div>

<pre id="log"></pre>

<script>
var lines = [];
function L(s){
  lines.push(s);
  document.getElementById('log').textContent = lines.join('\n');
}

L('UA: ' + navigator.userAgent);
L('speechSynthesis: ' + ('speechSynthesis' in window));
L('Utterance: ' + ('SpeechSynthesisUtterance' in window));

document.getElementById('a1').textContent = ('speechSynthesis' in window) ? '存在' : '不存在';
document.getElementById('a1').className = 'v ' + (('speechSynthesis' in window) ? 'ok' : 'bad');

function cnt(){
  try {
    var n = speechSynthesis.getVoices().length;
    document.getElementById('a2').textContent = n + ' 个';
    document.getElementById('a2').className = 'v ' + (n ? 'ok' : 'w');
    return n;
  } catch(e) {
    document.getElementById('a2').textContent = '读取失败';
    return -1;
  }
}
cnt();
setTimeout(cnt, 500);
setTimeout(cnt, 1500);
setTimeout(cnt, 3000);

function go(text, lang, tag){
  var box = document.getElementById('a3');
  L('--- ' + tag + ' ---');
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.85;
    u.volume = 1;

    var got = { s: false, e: false, x: null };
    u.onstart = function(){ got.s = true; L(tag + ' onstart'); };
    u.onend = function(){ got.e = true; L(tag + ' onend'); };
    u.onerror = function(ev){ got.x = ev.error; L(tag + ' onerror=' + ev.error); };

    speechSynthesis.speak(u);
    L(tag + ' speak 已调用');

    setTimeout(function(){
      var msg, cls;
      if (got.x) { msg = '报错 ' + got.x; cls = 'bad'; }
      else if (got.s) { msg = '出声了 ✓'; cls = 'ok'; }
      else { msg = '没有任何响应'; cls = 'bad'; }
      box.textContent = msg;
      box.className = 'v ' + cls;
      L(tag + ' → ' + msg + ' speaking=' + speechSynthesis.speaking);
    }, 2500);
  } catch(e) {
    box.textContent = '异常 ' + e.message;
    box.className = 'v bad';
    L(tag + ' 异常: ' + e.message);
  }
}

document.getElementById('b1').onclick = function(){ go('Hello. Test.', 'en-US', 'EN'); };
document.getElementById('b2').onclick = function(){ go('你好，测试。', 'zh-CN', 'ZH'); };
L('页面加载完成');
</script>
</body>
</html>
